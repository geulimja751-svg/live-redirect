<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>라이브</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 로딩 화면 */
    #loading {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #loading.hidden { display: none; }

    .live-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #ff3b3b;
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .status {
      font-size: 13px;
      color: #888;
      margin-bottom: 20px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid #222;
      border-top-color: #ff3b3b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 13px; color: #555; }

    /* 플레이어 화면 */
    #player-view {
      display: none;
      flex-direction: column;
      height: 100vh;
    }
    #player-view.show { display: flex; }

    #player-wrap {
      flex: 1;
      position: relative;
      background: #000;
    }
    #player-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* 선택 목록 화면 */
    #list-view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 24px;
      background: #0a0a0a;
    }
    #list-view.show { display: flex; }

    .list-title {
      font-size: 13px;
      color: #666;
      margin-bottom: 20px;
    }
    .live-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 480px;
    }
    .live-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #161616;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .live-item:hover { background: #1e1e1e; border-color: #ff3b3b44; }
    .thumb {
      width: 96px;
      height: 54px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
      background: #222;
    }
    .live-info { flex: 1; min-width: 0; }
    .live-title {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.4;
      color: #e8e8e8;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .badge-live {
      display: inline-block;
      margin-top: 6px;
      font-size: 10px;
      font-weight: 700;
      background: #ff3b3b;
      color: #fff;
      padding: 2px 6px;
      border-radius: 3px;
    }

    /* 에러 */
    #error-view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 24px;
      background: #0a0a0a;
      text-align: center;
    }
    #error-view.show { display: flex; }
    .error-box {
      background: #1a0f0f;
      border: 1px solid #3d1515;
      border-radius: 10px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
    }
    .error-title { font-size: 14px; font-weight: 600; color: #ff6b6b; margin-bottom: 8px; }
    .error-msg { font-size: 12px; color: #888; line-height: 1.6; }
    .retry-btn {
      display: inline-block;
      margin-top: 16px;
      padding: 8px 20px;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 6px;
      color: #ccc;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
    }
    .retry-btn:hover { background: #2a2a2a; }
  </style>
</head>
<body>

<!-- 로딩 -->
<div id="loading">
  <div class="status"><span class="live-dot"></span>LIVE</div>
  <div class="spinner"></div>
  <div class="loading-text">라이브 찾는 중...</div>
</div>

<!-- 플레이어 -->
<div id="player-view">
  <div id="player-wrap"></div>
</div>

<!-- 선택 목록 -->
<div id="list-view">
  <div class="status"><span class="live-dot"></span>LIVE</div>
  <div class="list-title" id="list-title"></div>
  <div class="live-list" id="live-list"></div>
</div>

<!-- 에러 -->
<div id="error-view">
  <div class="error-box">
    <div class="error-title" id="error-title"></div>
    <div class="error-msg" id="error-msg"></div>
    <a class="retry-btn" href="javascript:location.reload()">다시 시도</a>
  </div>
</div>

<script>
  // ★ API 키를 여기에 붙여넣으세요
  const API_KEY = 'AIzaSyBbGHS7EXSuj1t9V187FIr1flIfDMec3xA';

  const params = new URLSearchParams(location.search);
  const channelParam = params.get('channel') || '';
  const keywordParam = (params.get('keyword') || '').toLowerCase();

  function showPlayer(videoId) {
    document.getElementById('loading').classList.add('hidden');
    const view = document.getElementById('player-view');
    view.classList.add('show');
    document.getElementById('player-wrap').innerHTML =
      `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&mute=0" allowfullscreen allow="autoplay"></iframe>`;
  }

  function showList(lives, note) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('list-title').textContent = note;
    const listEl = document.getElementById('live-list');
    listEl.innerHTML = lives.map(v => {
      const vid = v.id.videoId;
      const title = v.snippet.title;
      const thumb = v.snippet.thumbnails?.medium?.url || '';
      return `<div class="live-item" onclick="showPlayer('${vid}')">
        <img class="thumb" src="${thumb}" alt="">
        <div class="live-info">
          <div class="live-title">${title}</div>
          <span class="badge-live">LIVE</span>
        </div>
      </div>`;
    }).join('');
    document.getElementById('list-view').classList.add('show');
  }

  function showError(title, msg) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('error-title').textContent = title;
    document.getElementById('error-msg').textContent = msg;
    document.getElementById('error-view').classList.add('show');
  }

  async function getChannelId(handle) {
    const h = handle.startsWith('@') ? handle.slice(1) : handle;
    const r = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=id&forHandle=${h}&key=${API_KEY}`);
    const d = await r.json();
    if (d.items && d.items.length > 0) return d.items[0].id;
    throw new Error('채널을 찾을 수 없습니다: ' + handle);
  }

  async function getLiveVideos(channelId) {
    const r = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${channelId}&eventType=live&type=video&maxResults=10&key=${API_KEY}`);
    const d = await r.json();
    if (d.error) throw new Error(d.error.message);
    return d.items || [];
  }

  async function run() {
    try {
      if (!channelParam) throw new Error('URL에 ?channel=@채널명 을 추가해주세요');
      if (API_KEY === 'YOUR_API_KEY_HERE') throw new Error('API 키를 설정해주세요');

      const channelId = await getChannelId(channelParam);
      const lives = await getLiveVideos(channelId);

      if (lives.length === 0) {
        showError('현재 라이브 없음', channelParam + ' 채널에 진행 중인 라이브가 없습니다.');
        return;
      }

      if (keywordParam) {
        const filtered = lives.filter(v =>
          v.snippet.title.toLowerCase().includes(keywordParam)
        );
        if (filtered.length === 1) { showPlayer(filtered[0].id.videoId); return; }
        if (filtered.length > 1) { showList(filtered, `"${keywordParam}" 관련 라이브 ${filtered.length}개`); return; }
        showList(lives, `"${keywordParam}" 매칭 없음 — 전체 라이브 ${lives.length}개`);
        return;
      }

      if (lives.length === 1) { showPlayer(lives[0].id.videoId); return; }
      showList(lives, `라이브 ${lives.length}개 — 선택해주세요`);

    } catch (e) {
      showError('오류 발생', e.message);
    }
  }

  run();
</script>
</body>
</html>
